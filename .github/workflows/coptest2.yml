# Name shown in the GitHub Actions tab
name: Polaris Coverity Scan

# WHEN to run: push to main, PR to main, or manually (Run workflow button)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  polaris-scan:
    runs-on: ubuntu-latest          # fresh Linux machine for every run

    # Polaris login details for all steps
    # URL -> Variables tab (vars), token -> Secrets tab (secrets)
    env:
      POLARIS_SERVER_URL: ${{ vars.COP_POLARIS_SERVER_URL }}
      POLARIS_ACCESS_TOKEN: ${{ secrets.COP_POLARIS_ACCESS_TOKEN }}

    steps:
      # STEP 1: Copy the repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: Install Java 21
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # STEP 3: Stop early if URL or token is missing
      # (Fork PRs get no secrets, so they will stop here - expected)
      - name: Check Polaris URL and token
        run: |
          if [ -z "$POLARIS_SERVER_URL" ]; then echo "POLARIS_SERVER_URL is EMPTY"; exit 1; fi
          if [ -z "$POLARIS_ACCESS_TOKEN" ]; then echo "POLARIS_ACCESS_TOKEN is EMPTY"; exit 1; fi

      # STEP 4 (optional): Plain Maven build to catch Java errors before Coverity
      # pom.xml asks for Java 25; these flags make it compile as Java 21
      - name: Test Maven build on Java 21 (outside Coverity)
        run: mvn -B clean compile -DskipTests -Djava.version=21 -Dmaven.compiler.release=21 -Dspotless.check.skip=true

      # STEP 5: Write polaris.yml - tells Coverity how to build the code
      - name: Create polaris.yml
        run: |
          rm -f polaris.yml
          cat > polaris.yml <<'EOF'
          version: "1"
          project:
            name: ${scm.git.repo}
            branch: ${scm.git.branch}
            revision:
              name: ${scm.git.commit}
              date: ${scm.git.commit.date}
          capture:
            build:
              cleanCommands:
                - shell: [mvn, -B, clean]
              buildCommands:
                - shell: [mvn, -B, clean, compile, -DskipTests, -Djava.version=21, -Dmaven.compiler.release=21, -Dspotless.check.skip=true]
          analyze:
            mode: central
          install:
            coverity:
              version: default
          EOF
          cat polaris.yml

      # STEP 6: Download the Polaris CLI from your Polaris server
      - name: Download Polaris CLI
        run: |
          curl -fLsS -o polaris_cli.zip "$POLARIS_SERVER_URL/api/tools/polaris_cli-linux64.zip"
          unzip -qo polaris_cli.zip -d /tmp
          echo "$(ls -d /tmp/polaris_cli-*/bin)" >> $GITHUB_PATH

      # STEP 7: Coverity captures the build, uploads it, Polaris analyses it
      # --co project.name=coptest -> overrides the name in polaris.yml
      # -w -> wait for the analysis to finish
      - name: Run Polaris analysis
        run: polaris --co project.name=coptest analyze -w
