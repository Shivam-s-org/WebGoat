name: Coverity on Polaris

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  coverity-on-polaris:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # must match <java.version> in pom.xml
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -v

      - name: Generate Polaris config file
        run: |
          cat > polaris.yml <<'EOF'
          version: "1"
          project:
            name: ${scm.git.repo}
            branch: ${scm.git.branch}
            revision:
              name: ${scm.git.commit}
              date: ${scm.git.commit.date}
          capture:
            build:
              cleanCommands:
                - shell: [mvn, -B, clean]
              buildCommands:
                - shell: [mvn, -B, clean, compile, -DskipTests, -Dspotless.check.skip=true]
          analyze:
            mode: central
          install:
            coverity:
              version: default
          EOF
          echo "---- polaris.yml ----"
          cat polaris.yml

      - name: Coverity on Polaris Scan
        env:
          POLARIS_SERVER_URL: ${{ secrets.COP_POLARIS_SERVER_URL }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.COP_POLARIS_ACCESS_TOKEN }}
        run: |
          curl -fLsS -o polaris.zip "$POLARIS_SERVER_URL/api/tools/polaris_cli-linux64.zip"
          unzip -qo polaris.zip -d "$RUNNER_TEMP/polaris"
          POLARIS_BIN=$(ls -d "$RUNNER_TEMP"/polaris/polaris_cli-*/bin)
          "$POLARIS_BIN/polaris" --co project.name=coptest analyze -w
