name: Coverity on Polaris Scan
on:
  push:
    branches: [main, master, develop, stage, release]
  pull_request:
    branches: [main, master, develop, stage, release]
  workflow_dispatch: {}

jobs:
  coverity-on-polaris:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Generate Polaris config file
        run: |
          # polaris.yml (turns on Coverity autoCapture)
          cat > polaris.yml <<'EOF'
          version: "1"
          project:
            name: ${scm.git.repo}
            branch: ${scm.git.branch}
            revision:
              name: ${scm.git.commit}
              date: ${scm.git.commit.date}
          capture:
            coverity:
              autoCapture: enable
          analyze:
            mode: central
          install:
            coverity:
              version: default
          EOF

      - name: Coverity on Polaris Scan
        env:
          POLARIS_SERVER_URL: ${{ vars.COP_POLARIS_SERVER_URL }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.COP_POLARIS_ACCESS_TOKEN }}
        run: |
          curl -fLsS -o polaris.zip $POLARIS_SERVER_URL/api/tools/polaris_cli-linux64.zip
          unzip -d ${{ runner.temp }} -jo polaris.zip && rm -f polaris.zip
          ${{ runner.temp }}/polaris --co project.name=${{ github.event.repository.name }} analyze -w --coverity-build-command "mvn -B clean install -DskipTests"

      - name: Save Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polaris-cli-logs
          path: ${{ github.workspace }}/.blackduck
