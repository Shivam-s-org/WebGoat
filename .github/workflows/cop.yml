name: Polaris Coverity Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  polaris-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # match <java.version> in WebGoat pom.xml
          cache: maven

      # Polaris does the only build, so there's no separate mvn step

      - name: Create polaris.yml
        run: |
          cat > polaris.yml <<'EOF'
          version: "1"
          project:
            name: ${scm.git.repo}
            branch: ${scm.git.branch}
            revision:
              name: ${scm.git.commit}
              date: ${scm.git.commit.date}
          capture:
            build:
              cleanCommands:
                - shell: [mvn, -B, clean]
              buildCommands:
                - shell: [mvn, -B, clean, compile, -DskipTests]
          analyze:
            mode: central
          install:
            coverity:
              version: default
          EOF
          cat polaris.yml

      - name: Download Polaris CLI
        run: |
          curl -fLsS -o polaris_cli.zip "${{ secrets.COP_POLARIS_SERVER_URL }}/api/tools/polaris_cli-linux64.zip"
          unzip -qo polaris_cli.zip -d /tmp
          echo "$(ls -d /tmp/polaris_cli-*/bin)" >> $GITHUB_PATH

      - name: Run Polaris analysis
        env:
          POLARIS_SERVER_URL: ${{ secrets.COP_POLARIS_SERVER_URL }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.COP_POLARIS_ACCESS_TOKEN }}
        run: polaris --co project.name=coptest analyze -w
